name: Process submission

# Two-stage by design:
#   1. `parse` runs the UNTRUSTED work — reading the attacker-controlled issue
#      body, resolving the magnet from the swarm with libtorrent, validating.
#      It has NO write token and NO secrets, so even a libtorrent exploit gets
#      an empty ephemeral runner. Its only output is a data artifact.
#   2. `publish` is TRUSTED. It runs no submission code — it just takes the
#      produced data/models.json and opens a PR. Nothing here is auto-pushed to
#      main blindly: auto-merge happens through a (revertible, auditable) PR.

on:
  issues:
    types: [opened, edited, labeled]

# Creating an issue *with* a label fires both `opened` and `labeled`; collapse
# those (and rapid edits) to a single run per issue so we never open two PRs for
# the same submission.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions: {}   # default to zero; each job opts into the minimum it needs

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    permissions: {}          # <-- no token power while touching hostile input
    outputs:
      decision: ${{ steps.proc.outputs.decision }}
      model_id: ${{ steps.proc.outputs.model_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libtorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-libtorrent
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Write issue body to file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}   # via env, never inlined into shell
        run: printf '%s' "$ISSUE_BODY" > issue_body.txt

      - name: Process (validate, resolve magnet, classify)
        id: proc
        run: python scripts/process_submission.py --body-file issue_body.txt --timeout 90

      - name: Upload proposed change
        uses: actions/upload-artifact@v4
        with:
          name: submission
          path: |
            data/models.json
          retention-days: 1

  publish:
    needs: parse
    if: needs.parse.outputs.decision == 'auto_merge' || needs.parse.outputs.decision == 'manual'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull in the proposed data file
        uses: actions/download-artifact@v4
        with:
          name: submission
          path: incoming

      - name: Apply proposed change
        # upload-artifact@v4 strips the common parent dir, so the file may land
        # at incoming/models.json rather than incoming/data/models.json — locate it.
        run: |
          src="$(find incoming -type f -name 'models.json' | head -1)"
          test -n "$src" || { echo "artifact missing models.json"; exit 1; }
          cp "$src" data/models.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild static index
        run: python scripts/build_index.py

      - name: Open PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: submission/issue-${{ github.event.issue.number }}
          title: "index: ${{ needs.parse.outputs.model_id }} (#${{ github.event.issue.number }})"
          body: |
            Submitted via #${{ github.event.issue.number }}.
            Decision: **${{ needs.parse.outputs.decision }}**.
          labels: ${{ needs.parse.outputs.decision == 'auto_merge' && 'submission' || 'needs-review' }}
          add-paths: |
            data/models.json
            data/index/**

      - name: Enable auto-merge (verified submissions only)
        if: needs.parse.outputs.decision == 'auto_merge' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ needs.parse.outputs.decision }}";
            const pr = "${{ steps.cpr.outputs.pull-request-url }}";
            const body = decision === "auto_merge"
              ? `✅ Verified — merged via ${pr}`
              : `🔍 Needs review — opened ${pr}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  reject:
    needs: parse
    if: needs.parse.outputs.decision == 'rejected'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ Rejected — duplicate or invalid. See the submission guidelines.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: "closed",
            });
