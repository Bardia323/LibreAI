name: Model / Magnet submission
description: Submit a new model or add a magnet to an existing one. Prefer using the form on the site, which fills this in for you.
title: "[submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the JSON generated by the **Submit** page on the site. The bot
        validates it, checks magnet contents, and either auto-merges (safe +
        verified) or opens a review PR.

        - Safe-to-auto-merge file types: `.safetensors`, `.gguf`, and text/config files.
        - Duplicate HuggingFace URLs or duplicate magnet infohashes are rejected.
  - type: textarea
    id: payload
    attributes:
      label: Submission JSON
      description: The bot reads the JSON object from this issue.
      render: json
      placeholder: |
        {
          "type": "model",
          "name": "My Model 7B",
          "creator": "someone",
          "category": "llm",
          "variant": "instruct",
          "architecture": "transformer",
          "parameters": "7B",
          "formats": ["safetensors", "gguf"],
          "huggingface": "https://huggingface.co/...",
          "magnets": [{ "label": "Q4_K_M", "url": "magnet:?xt=urn:btih:..." }]
        }
    validations:
      required: true
