<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — LibreAI</title>
  <meta name="description" content="Browse the LibreAI index of open AI models by category and architecture.">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">LibreAI</a>
  <ul class="nav-links">
    <li><a href="browse.html" class="active">Browse</a></li>
    <li><a href="submit.html">Submit</a></li>
    <li><a href="mirror.html">Mirror</a></li>
    <li><a href="https://github.com/Bardia323/LibreAI" target="_blank" rel="noopener">GitHub ↗</a></li>
  </ul>
</nav>

<main>
  <div class="container">

    <div class="filters">
      <div class="filter-row">
        <span class="filter-label">Category</span>
        <div class="filter-pills">
          <button class="pill active" data-cat="">All</button>
          <button class="pill" data-cat="llm">LLMs</button>
          <button class="pill" data-cat="diffusion">Diffusion</button>
          <button class="pill" data-cat="misc">Misc</button>
        </div>
        <div class="filter-right">
          <span class="result-count" id="result-count"></span>
          <input type="text" id="filter-input" placeholder="Filter…" autocomplete="off">
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Variant</span>
        <div class="filter-pills">
          <button class="pill active" data-variant="">All</button>
          <button class="pill" data-variant="base">Base</button>
          <button class="pill" data-variant="instruct">Instruct</button>
          <button class="pill" data-variant="rlhf">RLHF/RLAIF</button>
          <button class="pill" data-variant="finetune">Fine-tuned</button>
          <button class="pill" data-variant="lora">LoRA</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name">Name</th>
            <th data-sort="creator">Creator</th>
            <th data-sort="category">Category</th>
            <th data-sort="variant">Variant</th>
            <th data-sort="architecture">Architecture</th>
            <th data-sort="parameters">Params</th>
            <th>Swarm</th>
            <th>HF</th>
            <th data-sort="added">Added</th>
          </tr>
        </thead>
        <tbody id="browse-tbody">
          <tr><td colspan="9" style="text-align:center;color:var(--gray-400);padding:2rem">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pager" id="pager" style="display:none">
      <button id="prev-btn">‹ Prev</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn">Next ›</button>
    </div>

  </div>
</main>

<footer>
  <span>LibreAI — open index, no gatekeepers</span>
  <div class="footer-links">
    <a href="mirror.html">Mirror this site</a>
    <a href="https://github.com/Bardia323/LibreAI" target="_blank" rel="noopener">GitHub</a>
    <a href="submit.html">Submit a model</a>
  </div>
</footer>

<script src="static/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const [meta, models] = await Promise.all([loadMeta(), loadSlim()]);
    const PAGE = meta.page_size || 50;

    let state = {
      q:       getUrlParam('q'),
      cat:     getUrlParam('cat'),
      variant: getUrlParam('variant'),
      sort:    getUrlParam('sort') || 'added',
      dir:     getUrlParam('dir')  || 'desc',
      page:    Math.max(0, (parseInt(getUrlParam('page')) || 1) - 1),
    };

    document.getElementById('filter-input').value = state.q;
    document.querySelectorAll('.pill[data-cat]').forEach(p =>
      p.classList.toggle('active', p.dataset.cat === state.cat));
    document.querySelectorAll('.pill[data-variant]').forEach(p =>
      p.classList.toggle('active', p.dataset.variant === state.variant));

    function render() {
      const all = sortModels(filterModels(models, {
        q: state.q, category: state.cat, variant: state.variant
      }), state.sort, state.dir);

      const pages = Math.max(1, Math.ceil(all.length / PAGE));
      if (state.page > pages - 1) state.page = pages - 1;
      const slice = all.slice(state.page * PAGE, state.page * PAGE + PAGE);

      document.getElementById('result-count').textContent =
        `${all.length} model${all.length !== 1 ? 's' : ''}`;
      document.getElementById('browse-tbody').innerHTML = slice.length
        ? slice.map(renderRow).join('')
        : `<tr><td colspan="9" style="text-align:center;color:var(--gray-400);padding:3rem">No models found</td></tr>`;

      // Pager
      const pager = document.getElementById('pager');
      pager.style.display = all.length > PAGE ? 'flex' : 'none';
      document.getElementById('page-info').textContent = `Page ${state.page + 1} of ${pages}`;
      document.getElementById('prev-btn').disabled = state.page <= 0;
      document.getElementById('next-btn').disabled = state.page >= pages - 1;

      // Sort indicators
      document.querySelectorAll('thead th[data-sort]').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.dataset.sort === state.sort) th.classList.add(`sort-${state.dir}`);
      });
    }

    function resetPageAndRender() { state.page = 0; setUrlParam('page', ''); render(); }

    document.querySelectorAll('.pill[data-cat]').forEach(p => {
      p.addEventListener('click', () => {
        state.cat = p.dataset.cat;
        document.querySelectorAll('.pill[data-cat]').forEach(x =>
          x.classList.toggle('active', x.dataset.cat === state.cat));
        setUrlParam('cat', state.cat);
        resetPageAndRender();
      });
    });

    document.querySelectorAll('.pill[data-variant]').forEach(p => {
      p.addEventListener('click', () => {
        state.variant = p.dataset.variant;
        document.querySelectorAll('.pill[data-variant]').forEach(x =>
          x.classList.toggle('active', x.dataset.variant === state.variant));
        setUrlParam('variant', state.variant);
        resetPageAndRender();
      });
    });

    document.getElementById('filter-input').addEventListener('input', e => {
      state.q = e.target.value;
      setUrlParam('q', state.q);
      resetPageAndRender();
    });

    document.querySelectorAll('thead th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        if (state.sort === th.dataset.sort) {
          state.dir = state.dir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sort = th.dataset.sort;
          state.dir  = 'desc';
        }
        setUrlParam('sort', state.sort);
        setUrlParam('dir',  state.dir);
        resetPageAndRender();
      });
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (state.page > 0) { state.page--; setUrlParam('page', state.page + 1); render(); window.scrollTo(0, 0); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      state.page++; setUrlParam('page', state.page + 1); render(); window.scrollTo(0, 0);
    });

    render();
  });
</script>

</body>
</html>
